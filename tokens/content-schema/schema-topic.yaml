schema_name: TOPIC
prose_source: content-wiki-documentation/.internal/style-guides/guide-reference.md
version: 1.0.0-pilot

frontmatter_contract:
  required_fields: [title, slug, category, type, content_type, quality, status,
    audience, bcsc_class, language_protocol, last_edited, editor, short_description,
    paired_with]
  optional_fields: [index_type, entities, keynote, cites, source_refs,
    index_group, journal_refs]  # index_group: string; the Index Topic group this
    # TOPIC/GUIDE belongs to. Conditionally required (enforced by editorial-lint.py,
    # not this schema) in any category that has an index_type-bearing file. No
    # schema-level enum of valid values — validity is "matches a group some Index
    # Topic in this category declares," checked at commit time against the real
    # files.
  index_type:
    note: "when present (any value), this document is governed by
      protocol-index-topic.yaml instead of this file's required_sections and
      density_targets — see that schema for the Index Topic variant."
  journal_refs:
    type: array
    default: []
    purpose: "slugs of JOURNAL papers whose draws_from: list names this article — the
      inverse half of the self-healing cross-reference mechanism (forward half:
      JOURNAL draws_from:, in schema-journal.yaml). Machine-only, never rendered to a
      reader — JOURNAL-redesign master BRIEF Decision #5's zero-outbound-link rule
      applies symmetrically to this direction too. Derived, not authored: populate by
      mechanically inverting the JOURNAL corpus's draws_from: lists, never by editorial
      guess or as a completeness target. Consumed by tool-wiki-core (drift checks) and
      tool-journal-core (the bidirectional consistency check) — see
      BRIEF-tool-journal-core.md (project-editorial)."

required_sections:
  order: [lead, body_h2_sections, what_this_is_not, see_also]
  lead:
    no_h2_header: true
    opens_with_bolded_title: true
    lead_opening:
      content-wiki-corporate: consequence-first
      content-wiki-projects: consequence-first
      content-wiki-documentation: pattern-dependent  # see template-topic-lead-documentation.yaml —
        # DOC-LEAD-01 through 04 forbid definition-first opens; only DOC-LEAD-05
        # (reference/vocabulary articles) is definition-shaped. No single boolean
        # covers this wiki, unlike corporate/projects.
    forbidden_openers: ["X refers to", "X is a term used to describe"]
  body_h2_sections:
    min_count: tier_dependent  # see density_targets.scope_tiers.<tier>.h2_min (0-4);
      # replaces the flat floor below — a narrow_definitional-scope subject needs zero H2s
    max_count: 6
    h3_for_supporting_detail: true
  what_this_is_not:
    required: "true when bcsc_class: forward-looking; recommended otherwise"
    purpose: "answers the skeptical reader's next question in-line, not deferred to a FAQ"
    max_words: 120
    content_rule: "must be about the subject (what's built vs. planned, real scope
      limits) — never about the page itself or the wiki's editorial/publishing state.
      See register-documentation.yaml's Provenance Notes rule for the general version
      of this constraint."
  see_also:
    wikilinks_only: true
    no_raw_paths: true
    no_governance_doc_refs: true

density_targets:
  # Wikipedia-grounded scope-tier system (2026-09) — replaces the prior flat
  # standard.word_range: [1200, 1800] floor. Two independent Playwright-measured
  # passes over 44 real live Wikipedia articles found length tracks subject scope,
  # not a uniform quality floor (real range 87-7,972 words); word count alone was
  # the dominant driver of false REWRITE verdicts on otherwise-complete short
  # articles. See pointsav-design-system research trail / project-editorial's
  # BRIEF-editorial-programme-master.md §Track-B for the full evidence.
  min_facts_per_100_words: 3   # unchanged — this is the real binding density check
  binding_check: min_facts_per_100_words

  hard_floor:
    words: 250        # WP:STUB's own boundary
    action: merge_or_expand   # never "pad to reach a target"
  soft_ceiling:
    words: 6000       # below this, length alone is never a defect (WP:SIZERULE)
    split_at: 8000

  scope_tiers:   # target scales with subject scope, not one number
    narrow_definitional:      { words: [300, 900],   h2_min: 0 }
    single_mechanism:         { words: [900, 2000],  h2_min: 2 }
    multi_variant_or_survey:  { words: [2000, 5000], h2_min: 3 }
    foundational_survey:      { words: [5000, 8000], h2_min: 4 }

  tier_assignment: facet_count
  # A facet = a jurisdiction, a variant, a distinct mechanism, or a materially
  # different application the subject genuinely has, drawn from the article's
  # own category's scope statement in categories.yaml. Human judgment call at
  # authoring time (not automated) as of this token's ratification:
  #   1 facet    -> narrow_definitional
  #   2-4 facets -> single_mechanism
  #   5-10 facets -> multi_variant_or_survey
  #   >10 facets -> foundational_survey

infobox:
  required_for: [organization, product, software, platform, named_service]
  forbidden_for: [concept, theory, pattern, process, financial_instrument]

bilingual:
  pair_required: true
  strategic_adaptation_not_translation: true
