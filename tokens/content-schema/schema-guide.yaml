schema_name: GUIDE
prose_source: media-knowledge-documentation/.internal/style-guides/guide-how-to.md
version: 1.0.0-pilot

frontmatter_contract:
  required_fields: [title, slug, category, type, content_type, quality, status,
    audience, last_edited, editor, short_description]
  optional_fields: [journal_refs]

journal_refs:
  type: array
  default: []
  purpose: "slugs of JOURNAL papers whose draws_from: list names this article — the
    inverse half of the self-healing cross-reference mechanism (forward half:
    JOURNAL draws_from:, in schema-journal.yaml). Machine-only, never rendered to a
    reader — JOURNAL-redesign master BRIEF Decision #5's zero-outbound-link rule
    applies symmetrically to this direction too. Derived, not authored: populate by
    mechanically inverting the JOURNAL corpus's draws_from: lists, never by editorial
    guess or as a completeness target. Consumed by tool-wiki-core (drift checks) and
    tool-journal-core (the bidirectional consistency check) — see
    BRIEF-tool-journal-core.md (project-editorial)."

title_format:
  imperative_verb_phrase: true
  forbidden: ["X Deployment Guide", "X Configuration"]

required_sections:
  order: [prerequisites, purpose, procedure, expected_outcome, verification, rollback,
    next_steps]
  prerequisites:
    format: bulleted_list
  procedure:
    one_action_per_step: true
    numbered: true
    no_nested_bullet_lists: true
  verification:
    required_after: every_state_change
  rollback:
    required: true

code_blocks:
  fenced_with_language_tag: true

callouts:
  types: [note, warning, tip]
  max_per_guide: 5

density_targets:
  word_range: [500, 3000]
  note: "a guide that cannot be completed in one sitting is too long — split it"

bilingual:
  pair_required: false
  note: "GUIDEs authored in English; publication surface is
    media-knowledge-documentation/how-to/, canonical source is
    woodfine-fleet-deployment"
